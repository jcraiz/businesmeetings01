<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meeting English Trainer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5d6881;--pr:#2f5bea;--ok:#168a4a;--bad:#c9302c;--bd:#dde3f0;--okb:#e5f6ec;--badb:#fbe9e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ecf6;--mu:#9aa5bf;--pr:#6c8cff;--ok:#4cc582;--bad:#ff7a73;--bd:#2c3347;--okb:#17301f;--badb:#3a1e1d}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--tx:#e8ecf6;--mu:#9aa5bf;--pr:#6c8cff;--ok:#4cc582;--bad:#ff7a73;--bd:#2c3347;--okb:#17301f;--badb:#3a1e1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0 .6em}
.mu{color:var(--mu);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.lv{display:flex;gap:12px;align-items:center;justify-content:space-between}
.lock{opacity:.55}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 14px}.bar>i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bd);color:var(--mu);margin-bottom:8px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px}.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}
input.g{font:inherit;border:0;border-bottom:2px solid var(--pr);background:transparent;color:var(--tx);text-align:center;min-width:5ch;margin:0 3px}
input.t{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1px dashed var(--bd);border-radius:10px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.big{font-size:2.4rem;text-align:center}
.say{font-size:1.1rem;font-weight:600}
</style></head><body><main id="app"></main>
<script>
const F=["Checking the agenda","Assigning someone to take minutes","Officially starting the meeting","Thanking attendees","Stating the objective","Opening the floor for discussion","Inviting someone to speak","Summarizing the discussion","Moving to a vote","Confirming the outcome","Checking for any other business","Closing the meeting"];
const S=["You are the chair. Papers are on the table and you want to be sure everyone has the agenda.","You are the chair. You need one person to write the notes of the meeting.","Everyone is seated and ready. You want to begin.","Your colleagues came to the meeting with very little warning. You want to thank them.","You are the chair. You want to tell everyone why you called this meeting (a new proposal).","You have introduced the topic. Now you want people to start talking about it.","You want a specific person, Maria, to give her opinion.","A long discussion has finished. You want to repeat the main points briefly.","Nobody has anything more to say. You want people to vote.","The vote is finished and most people agreed. You confirm the result.","The agenda is finished. You ask if anyone has more topics.","Everything is done. You end the meeting and mention the next one."];
const P=[[0,"Has everybody got a copy of the agenda?"],[0,"Does everyone have an agenda?"],[0,"Everybody should have received an agenda."],[1,"Would you mind taking minutes, John?"],[1,"Could somebody take the minutes, please?"],[2,"Well then, let's get started."],[3,"First of all, thank you everyone for attending at short notice."],[4,"The objective of today's meeting is to discuss the proposal."],[4,"We're here today to discuss a proposal."],[4,"The purpose of our meeting today is to discuss the following proposal."],[5,"Without further ado, I'd like to open it up for discussion."],[5,"Let's open it up for discussion."],[6,"Who'd like to start the discussion?"],[6,"Perhaps if we can start with you, Maria, what's your view?"],[6,"Let's hear from Maria."],[6,"Do you have a view on this, Maria?"],[7,"So to sum up..."],[7,"In summary..."],[7,"So the main points are..."],[8,"If there's no more discussion, we'll put it to a vote."],[8,"All those in favor? All those against?"],[9,"Then that's agreed."],[9,"The motion is carried."],[10,"Any other business?"],[11,"Then we'll close the meeting. Thank you everyone."],[11,"The next meeting will be in two weeks at the same time."]];
const $=s=>document.querySelector(s),rnd=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>[...a].sort(()=>Math.random()-.5);
const byF=f=>P.filter(p=>p[0]==f).map(p=>p[1]);
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
const sc=(say,ts)=>{const sw=norm(say);return Math.max(...ts.map(t=>{const w=norm(t);return w.filter(x=>sw.includes(x)).length/w.length}))};
const other=(f,n,pool=[...Array(12).keys()])=>shuf(pool.filter(x=>x!=f)).slice(0,n);
const LC=[{a:"Does everyone have an agenda? Good. Would you mind taking minutes, John?",q:"What does the chair ask John to do?",o:["Write the notes of the meeting","Present the proposal","Vote on the motion","Send the agenda"],k:0},{a:"If there's no more discussion, we'll put it to a vote. All those in favor? All those against? Then that's agreed.",q:"What was the result?",o:["The proposal was accepted","The proposal was rejected","The discussion continued","The meeting was cancelled"],k:0},{a:"Any other business? No? Then we'll close the meeting. Thank you everyone. The next meeting will be in two weeks at the same time.",q:"What will happen in two weeks?",o:["Another meeting at the same time","A vote on the motion","The agenda will be sent","Nothing, the meeting is cancelled"],k:0}];

function build(l){
 const q=[];
 if(l==1){
  shuf(P).slice(0,5).forEach(([f,t])=>q.push({y:"mcq",tag:"Listening",q:"Listen. What is the speaker doing?",au:t,o:shuf([F[f],...other(f,3).map(x=>F[x])]),k:F[f],ex:`“${t}”`}));
  other(-1,4).forEach(f=>{const c=rnd(byF(f));q.push({y:"mcq",tag:"Quiz",q:`Which phrase is used for: <b>${F[f]}</b>?`,o:shuf([c,...other(f,3).map(x=>rnd(byF(x)))]),k:c,ex:`Model: “${c}”`})});
  shuf(P.filter(p=>p[1].split(" ").length<=9)).slice(0,3).forEach(([f,t])=>q.push({y:"say",tag:"Speaking",cue:`Read aloud (${F[f]}):`,show:t,T:[t],th:.7}));
 }
 if(l==2){
  shuf(P.filter(p=>p[1].split(" ").length>=5)).slice(0,4).forEach(([f,t])=>q.push({y:"gap",tag:"Listening gap-fill",t}));
  shuf(P.filter(p=>{const n=p[1].split(" ").length;return n>=5&&n<=9})).slice(0,3).forEach(([f,t])=>q.push({y:"ord",tag:"Word order",t,cue:F[f]}));
  other(-1,3).forEach(f=>{const T=byF(f);q.push({y:"say",tag:"Speaking",cue:`Say a phrase from memory for: <b>${F[f]}</b>`,hint:`Hint: starts with “${T[0].split(" ").slice(0,3).join(" ")}…”`,T,th:.7})});
 }
 if(l==3){
  other(-1,4).forEach(f=>{const c=rnd(byF(f)),near=[f-2,f-1,f+1,f+2].filter(x=>x>=0&&x<12);q.push({y:"mcq",tag:"Situation",q:S[f],o:shuf([c,...shuf(near).slice(0,3).map(x=>rnd(byF(x)))]),k:c,ex:`Best: “${c}”`})});
  LC.forEach(c=>q.push({y:"mcq",tag:"Listening comprehension",q:c.q,au:c.a,o:shuf(c.o),k:c.o[c.k],ex:`Transcript: “${c.a}”`}));
  other(-1,3).forEach(f=>q.push({y:"say",tag:"Speaking: your turn",cue:`<b>Situation:</b> ${S[f]}<br>Say what you would say as chair.`,T:byF(f),th:.6,model:byF(f)[0]}));
 }
 return q;
}

let prog={};try{prog=JSON.parse(localStorage.getItem("met")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("met",JSON.stringify(prog))}catch(e){}};
const open=l=>l==1||(prog[l-1]||0)>=70;
let L,Q,i,right,locked;

function say(t,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang=="en-GB")||vs.find(v=>/^en/i.test(v.lang));if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";u.rate=slow?.65:.92;speechSynthesis.speak(u)}catch(e){}}
window.sayB=(el,slow)=>say(el.dataset.t,slow);
const aud=t=>`<div class="row"><button class="p" data-t="${t.replace(/"/g,'&quot;')}" onclick="sayB(this,0)">🔊 Play</button><button data-t="${t.replace(/"/g,'&quot;')}" onclick="sayB(this,1)">🐢 Slow</button></div>`;

function home(){
 const tot=[1,2,3].filter(l=>(prog[l]||0)>=70).length;
 $("#app").innerHTML=`<h1>🗣️ Meeting English Trainer</h1><p class="mu">Functional language for formal meetings. 3 levels · about 35–45 minutes. Score 70% or more to unlock the next level. Use headphones and allow the microphone for the speaking tasks (Chrome or Edge work best).</p>
 <div class="bar"><i style="width:${tot/3*100}%"></i></div>
 ${[["Level 1","Recognise","Listen and identify phrases; choose the right phrase; read aloud."],["Level 2","Complete","Listening gap-fill, word order, and speaking from memory."],["Level 3","Produce","Real situations, listening comprehension, and free speaking."]].map((d,k)=>{const l=k+1,o=open(l);return`<div class="card lv ${o?"":"lock"}"><div><h2>${o?"":"🔒 "}${d[0]}: ${d[1]}</h2><div class="mu">${d[2]}</div><div class="mu">${prog[l]!=null?"Best score: "+prog[l]+"%"+(prog[l]>=70?" ✅":""):o?"Not tried yet":"Score 70%+ in Level "+(l-1)+" to unlock"}</div></div><button class="p" ${o?"":"disabled"} onclick="start(${l})">${prog[l]!=null?"Retry":"Start"}</button></div>`}).join("")}
 <div class="row"><button onclick="if(confirm('Reset all progress?')){prog={};save();home()}">Reset progress</button></div>`;
}
function start(l){L=l;Q=build(l);i=0;right=0;item()}
function head(){return`<div class="mu">Level ${L} · ${i+1} / ${Q.length}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>`}
function fin(ok,msg){locked=true;if(ok)right++;const f=$("#fb");f.className="fb "+(ok?"ok":"bad");f.innerHTML=(ok?"✅ ":"❌ ")+msg;$("#nx").hidden=false;$("#nx").scrollIntoView({block:"nearest"})}
const nxt=`<div class="row"><button class="p" id="nx" hidden onclick="i++;item()">Next →</button></div>`;

function item(){
 if(i>=Q.length)return done();
 locked=false;const it=Q[i];let h=head()+`<div class="card"><span class="tag">${it.tag}</span>`;
 if(it.y=="mcq"){h+=`<div class="say">${it.q}</div>${it.au?aud(it.au):""}${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}<div id="fb"></div></div>${nxt}`;$("#app").innerHTML=h;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const ok=it.o[b.dataset.k]==it.k;b.classList.add(ok?"ok":"bad");if(!ok)document.querySelectorAll(".opt").forEach(x=>{if(it.o[x.dataset.k]==it.k)x.classList.add("ok")});fin(ok,ok?"Correct! "+it.ex:"Not quite. "+it.ex)});
  if(it.au)setTimeout(()=>say(it.au),300);}
 if(it.y=="gap"){const w=it.t.split(" ");let c=w.map((x,k)=>k).filter(k=>k&&w[k].replace(/[^A-Za-z']/g,"").length>=5);if(c.length<2)c=w.map((x,k)=>k).filter(k=>k&&w[k].replace(/[^A-Za-z']/g,"").length>=4);const g=shuf(c).slice(0,2);it.g=g;
  h+=`<div class="say">Listen and fill in the missing words.</div>${aud(it.t)}<p style="font-size:1.1rem;line-height:2.2">${w.map((x,k)=>{if(!g.includes(k))return x;const m=x.match(/^(\W*)(.*?)(\W*)$/);return`${m[1]}<input class="g" data-k="${k}" size="${m[2].length}" autocomplete="off" autocapitalize="off">${m[3]}`}).join(" ")}</p><div class="row"><button class="p" id="ck">Check</button></div><div id="fb"></div></div>${nxt}`;$("#app").innerHTML=h;
  $("#ck").onclick=()=>{if(locked)return;let ok=true;document.querySelectorAll("input.g").forEach(n=>{const a=w[n.dataset.k].replace(/[^A-Za-z']/g,"").toLowerCase();const r=n.value.trim().toLowerCase()==a;ok=ok&&r;if(!r)n.value=a;n.style.borderColor=r?"var(--ok)":"var(--bad)"});fin(ok,ok?"Well done! “"+it.t+"”":"Correct answers shown. Full phrase: “"+it.t+"”")};setTimeout(()=>say(it.t),300);}
 if(it.y=="ord"){const w=it.t.split(" ");it.pool=shuf(w.map((x,k)=>[x,k]));it.sel=[];
  h+=`<div class="say">Put the words in order.</div><div class="mu">Function: ${it.cue}</div><div class="chips" id="sel"></div><div class="chips" id="pool"></div><div class="row"><button class="p" id="ck">Check</button><button data-t="${it.t.replace(/"/g,'&quot;')}" onclick="sayB(this,0)">🔊 Hear it</button></div><div id="fb"></div></div>${nxt}`;$("#app").innerHTML=h;
  const draw=()=>{$("#sel").innerHTML=it.sel.map((c,k)=>`<button data-s="${k}">${c[0]}</button>`).join("");$("#pool").innerHTML=it.pool.map((c,k)=>`<button data-p="${k}">${c[0]}</button>`).join("");
   document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(locked)return;it.pool.push(it.sel.splice(b.dataset.s,1)[0]);draw()});
   document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(locked)return;it.sel.push(it.pool.splice(b.dataset.p,1)[0]);draw()})};draw();
  $("#ck").onclick=()=>{if(locked)return;const ok=it.sel.length==w.length&&it.sel.map(c=>c[0]).join(" ")==it.t;fin(ok,ok?"Perfect! “"+it.t+"”":"Correct order: “"+it.t+"”")}}
 if(it.y=="say"){const R=window.SpeechRecognition||window.webkitSpeechRecognition;it.tries=0;
  h+=`<div class="say">${it.cue}</div>${it.show?`<p class="big" style="font-size:1.3rem">“${it.show}”</p>${aud(it.show)}`:""}${it.hint?`<div class="mu">${it.hint}</div>`:""}
  ${R?`<div class="row"><button class="p" id="mic">🎤 Record</button><button id="sk">Skip</button></div><div class="mu" id="heard"></div>`:`<p class="mu">Speech recognition isn't available in this browser, so type what you would say instead (or use Chrome/Edge).</p><input class="t" id="ty" placeholder="Type your sentence"><div class="row"><button class="p" id="ck">Check</button></div>`}<div id="fb"></div></div>${nxt}`;$("#app").innerHTML=h;
  const grade=alts=>{const s=Math.max(...alts.map(a=>sc(a,it.T)));const ok=s>=it.th;$("#heard").textContent="I heard: “"+alts[0]+"” · match "+Math.round(s*100)+"%";if(ok)fin(true,"Great pronunciation and wording!");else{it.tries++;const f=$("#fb");f.className="fb bad";f.innerHTML="Not quite ("+Math.round(s*100)+"% match). Try again"+(it.tries>=2?". Model: “"+(it.model||it.T[0])+"”":".")}};
  if(R){$("#sk").onclick=()=>{if(!locked)fin(false,"Skipped. Model: “"+(it.model||it.T[0])+"”")};
   const typed=()=>{if($("#ty"))return;const d=document.createElement("div");d.innerHTML='<p class="mu">The microphone is not available here, so type your answer instead.</p><input class="t" id="ty" placeholder="Type your sentence"><div class="row"><button class="p" id="ck">Check</button></div>';$("#heard").after(d);$("#ck").onclick=()=>{if(locked)return;const s=sc($("#ty").value,it.T),ok=s>=it.th;fin(ok,ok?"Good!":"Model: “"+(it.model||it.T[0])+"”")}};
   const MSG={"not-allowed":"Microphone permission was blocked. Allow it in your browser's address bar, or type your answer below.","service-not-allowed":"Speech recognition is blocked in this page or browser.","audio-capture":"No microphone was found.","network":"Speech recognition needs an internet connection.","no-speech":"I didn't hear anything. Check your microphone and try again.","aborted":""};
   $("#mic").onclick=()=>{if(locked)return;try{speechSynthesis.cancel()}catch(x){}const m=$("#mic");const reset=()=>{m.textContent="🎤 Record";m.disabled=false};
    let r;try{r=new R()}catch(x){$("#heard").textContent="Speech recognition could not start.";typed();return}
    r.lang="en-US";r.maxAlternatives=3;r.continuous=false;m.textContent="🔴 Listening…";m.disabled=true;
    r.onresult=e=>{try{grade([...e.results[0]].map(a=>a.transcript))}catch(x){}};
    r.onerror=e=>{$("#heard").textContent=MSG[e.error]!=null?MSG[e.error]:"Microphone problem ("+e.error+").";if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error))typed()};
    r.onend=reset;try{r.start()}catch(x){reset();$("#heard").textContent="Could not start the microphone.";typed()}}}
  else{$("#ck").onclick=()=>{if(locked)return;const v=$("#ty").value;const s=sc(v,it.T);const ok=s>=it.th;fin(ok,ok?"Good!":"Model: “"+(it.model||it.T[0])+"”")}}}
}
function done(){const p=Math.round(right/Q.length*100);prog[L]=Math.max(prog[L]||0,p);save();const pass=p>=70;
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div class="big">${pass?"🎉":"💪"}</div><h2>Level ${L} score: ${p}%</h2><p>${right} out of ${Q.length} correct.</p><p class="mu">${pass?(L<3?"Level "+(L+1)+" is unlocked!":"You completed all three levels. Excellent work!"):"You need 70% to unlock the next level. Review the phrases and try again."}</p><div class="row" style="justify-content:center">${pass&&L<3?`<button class="p" onclick="start(${L+1})">Go to Level ${L+1}</button>`:""}<button onclick="start(${L})">Retry level</button><button onclick="home()">Menu</button></div></div>`}
if("speechSynthesis" in window)speechSynthesis.getVoices();
home();
</script></body></html>
